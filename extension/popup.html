<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Less Token</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      width: 400px;
      background: #ffffff;
      color: #1f2937;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
    }

    .logo {
      font-weight: 600;
      font-size: 18px;
      color: #0f172a;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #6b7280;
    }

    .settings-btn:hover {
      color: #1f2937;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #374151;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .status {
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }

    .status.loading {
      background: #fef3c7;
      color: #92400e;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .cross-promo {
      text-align: center;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
    }

    .cross-promo a {
      color: #2563eb;
      text-decoration: none;
    }

    .cross-promo a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⚡ Less Token</div>
      <div style="display: flex; gap: 8px;">
        <button class="settings-btn" id="historyBtn" title="View history">📊</button>
        <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Input</div>
      <div class="input-group">
        <label for="input-text">Text or Paste Content:</label>
        <textarea id="input-text" placeholder="Paste your text here..."></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Settings</div>
      <div class="input-group">
        <label for="provider">AI Provider:</label>
        <select id="provider">
          <option value="openai">OpenAI (GPT-4)</option>
          <option value="claude">Claude (Anthropic)</option>
          <option value="gemini">Google Gemini</option>
          <option value="grok">Grok (x.ai)</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>

      <div class="input-group">
        <label for="style">Optimization Style:</label>
        <select id="style">
          <option value="general">General</option>
          <option value="technical">Technical</option>
          <option value="marketing">Marketing</option>
          <option value="academic">Academic</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Optimization</div>
      <div class="button-group">
        <button class="btn-primary" id="optimizeBtn">Optimize</button>
        <button class="btn-secondary" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="section" id="status-container" style="display: none;">
      <div id="status" class="status"></div>
    </div>

    <div class="cross-promo">
      Did you know? <a href="https://lesstoken.app/file" target="_blank" rel="noopener noreferrer">lesstoken.app</a> also handles .txt, .md, .docx, .csv, .pdf files and images.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
