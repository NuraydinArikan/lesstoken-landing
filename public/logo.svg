<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Section -->

  <!-- Outer Circle (Daire) -->
  <circle cx="150" cy="100" r="80" fill="none" stroke="url(#gradCircle)" stroke-width="8"/>

  <!-- Inner Circle (Daha koyu) -->
  <circle cx="150" cy="100" r="70" fill="none" stroke="url(#gradBlue)" stroke-width="3" opacity="0.5"/>

  <!-- Z Shape (Tasarruf / Azalma) -->
  <path d="M 120 70 L 180 70 L 125 100 L 180 130 L 120 130" fill="none" stroke="url(#gradBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward Arrow (Trend / İyileşme) -->
  <path d="M 170 110 L 170 60 M 160 70 L 170 60 L 180 70" fill="none" stroke="url(#gradCircle)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text Section -->

  <!-- "LessToken" -->
  <text x="150" y="230" font-family="Arial, sans-serif" font-size="56" font-weight="900" text-anchor="middle" fill="#0369a1">
    LessToken
  </text>

  <!-- ".APP" -->
  <text x="150" y="275" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#06b6d4">
    .APP
  </text>
</svg>
